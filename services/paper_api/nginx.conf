limit_req_zone $binary_remote_addr zone=paper_requests:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=paper_imports:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=paper_actions:10m rate=30r/m;
server {
    listen 80;
    server_name _;
    client_max_body_size 32m;
    access_log off;
    limit_req_status 429;
    proxy_read_timeout 150s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    location = /api/imports {
        limit_req zone=paper_imports burst=3 nodelay;
        proxy_pass http://api:8000;
    }
    location ~ ^/api/workspaces/[^/]+/actions/ {
        limit_req zone=paper_actions burst=10 nodelay;
        proxy_pass http://api:8000;
    }
    location /api/ {
        limit_req zone=paper_requests burst=60 nodelay;
        proxy_pass http://api:8000;
    }
    location / {
        proxy_pass http://site:3000;
        proxy_http_version 1.1;
    }
}
